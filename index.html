<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Means Clustering</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Employee Clustering</h1>

        <label for="fileUpload">Upload CSV File:</label>
        <input type="file" id="fileUpload" accept=".csv">

        <label for="numClusters">Select Number of Clusters:</label>
        <input type="number" id="numClusters" min="2" max="10" value="3">

        <button onclick="performClustering()">Run K-Means</button>

        <div id="results">
            <h2>Results</h2>
            <canvas id="clusterChart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
